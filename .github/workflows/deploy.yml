name: Deploy to Staging

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ndhu-shbs

jobs:
  # ──────────────────────────────────────────────────────────────
  # Build and push Docker images
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - context: server
            image: server
            target: production
          - context: client
            image: client
            target: production
          - context: ai-service
            image: ai
            target: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}

  # ──────────────────────────────────────────────────────────────
  # Deploy to staging host via SSH over Tailscale
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - uses: actions/checkout@v4

      # Join the same Tailscale network as the staging host so the runner
      # can reach it via its stable Tailscale IP (no public IP required).
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            REPO=/opt/ndhu-shbs/repo

            # Pull latest compose files and traefik config from GitHub
            cd "$REPO"
            git pull --ff-only

            # Authenticate to GHCR and deploy with pre-built images
            cd "$REPO"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -p ndhu-shbs -f docker-compose.prod.yml pull
            docker compose -p ndhu-shbs -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
