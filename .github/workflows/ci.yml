name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # ──────────────────────────────────────────────────────────────
  # Client — lint, typecheck, build
  # ──────────────────────────────────────────────────────────────
  client:
    name: Client (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Prepare env
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────
  # Server — vet, test with coverage gate
  # ──────────────────────────────────────────────────────────────
  server:
    name: Server (vet · test · coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shbs_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Prepare env
        run: cp .env.example .env

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/shbs_test?sslmode=disable

      - name: Enforce 80% coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          awk "BEGIN { if ($COVERAGE < 80) { print \"Coverage below 80%: \" $COVERAGE \"%\"; exit 1 } }"

  # ──────────────────────────────────────────────────────────────
  # AI service — lint, test
  # ──────────────────────────────────────────────────────────────
  ai:
    name: AI Service (lint · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Prepare env
        run: cp .env.example .env

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: pytest --tb=short
