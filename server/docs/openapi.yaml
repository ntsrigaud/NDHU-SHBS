openapi: 3.0.0
info:
  description: REST API for the NDHU campus second-hand textbook marketplace.
  title: NDHU Second-Hand Book Store API
  termsOfService: http://swagger.io/terms/
  contact:
    name: SHBS Dev Team
  license:
    name: MIT
  version: "1.0"
paths:
  /auth/login:
    post:
      description: Authenticates a user with email and password, returns a JWT token
      tags:
        - Auth
      summary: Login
      operationId: loginUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.SwaggerLoginRequest"
        description: Login credentials
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerLoginResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /auth/logout:
    post:
      security:
        - BearerAuth: []
      description: Invalidates the current JWT and clears the session cookie
      tags:
        - Auth
      summary: Logout
      operationId: logoutUser
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerMessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /auth/register:
    post:
      description: Creates a new user account and sends an email verification link
      tags:
        - Auth
      summary: Register
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.SwaggerRegisterRequest"
        description: Registration details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerMessageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /auth/resend-verification:
    post:
      description: Sends a new verification email to the specified address if the
        account is unverified
      tags:
        - Auth
      summary: Resend verification email
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.SwaggerResendVerificationRequest"
        description: Email address
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerMessageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /auth/sso/callback:
    get:
      description: Validates the CAS ticket and issues a JWT
      tags:
        - Auth
      summary: SSO Callback
      operationId: ssoCallback
      parameters:
        - description: CAS ticket
          name: ticket
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /auth/sso/login:
    get:
      description: Redirects the browser to the NDHU CAS login page
      tags:
        - Auth
      summary: SSO Login
      operationId: ssoLogin
      responses:
        "302":
          description: Found
        "503":
          description: Service Unavailable
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /auth/verify:
    get:
      description: Verifies a user's email address using the token from the
        verification email
      tags:
        - Auth
      summary: Verify email
      operationId: verifyEmail
      parameters:
        - description: Verification token
          name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerMessageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /cart:
    get:
      security:
        - BearerAuth: []
      description: Returns the authenticated user's cart items
      tags:
        - Cart
      summary: List cart
      operationId: getCart
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/model.CartItemResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
    post:
      security:
        - BearerAuth: []
      description: Adds a listing to the authenticated user's cart
      tags:
        - Cart
      summary: Add to cart
      operationId: addToCart
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.SwaggerAddToCartRequest"
        description: Listing to add
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerMessageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  "/cart/{id}":
    delete:
      security:
        - BearerAuth: []
      description: Removes a cart item from the authenticated user's cart
      tags:
        - Cart
      summary: Remove from cart
      operationId: removeFromCart
      parameters:
        - description: Cart item ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerMessageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /images:
    post:
      security:
        - BearerAuth: []
      description: Registers an image metadata record in the database after upload to S3
      tags:
        - Images
      summary: Register image
      operationId: registerImage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.SwaggerRegisterImageRequest"
        description: Image metadata
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ImageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  "/images/{id}":
    get:
      description: Returns image metadata by ID
      tags:
        - Images
      summary: Get image
      operationId: getImage
      parameters:
        - description: Image ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ImageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /listings:
    get:
      description: Paginated, filterable list of book listings. Returns the full page
        in the JSON body and total count in X-Total-Count header.
      tags:
        - Listings
      summary: List listings
      operationId: getListings
      parameters:
        - description: "Filter by status (default: active)"
          name: status
          in: query
          schema:
            type: string
        - description: Filter by department
          name: department
          in: query
          schema:
            type: string
        - description: Filter by condition (good|moderate|poor)
          name: condition
          in: query
          schema:
            type: string
        - description: Full-text search on title, author, or ISBN
          name: search
          in: query
          schema:
            type: string
        - description: Minimum price
          name: price_min
          in: query
          schema:
            type: number
        - description: Maximum price
          name: price_max
          in: query
          schema:
            type: number
        - description: "Page number (default: 1)"
          name: page
          in: query
          schema:
            type: integer
        - description: "Items per page (default: 20, max: 100)"
          name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/model.ListingWithImages"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
    post:
      security:
        - BearerAuth: []
      description: Publishes a new book listing for the authenticated seller.
      tags:
        - Listings
      summary: Create listing
      operationId: createListing
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.SwaggerCreateListingRequest"
        description: Listing details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ListingWithImages"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /listings/me:
    get:
      security:
        - BearerAuth: []
      description: Returns all listings created by the authenticated user, newest first.
      tags:
        - Listings
      summary: My listings
      operationId: getMyListings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/model.ListingWithImages"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  "/listings/{id}":
    get:
      description: Returns a single listing with seller info and image URLs.
      tags:
        - Listings
      summary: Get listing by ID
      operationId: getListing
      parameters:
        - description: Listing ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ListingWithImages"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
    delete:
      security:
        - BearerAuth: []
      description: Soft-deletes a listing by setting its status to 'delisted'. Only
        the seller or an admin may delete.
      tags:
        - Listings
      summary: Delete listing
      operationId: deleteListing
      parameters:
        - description: Listing ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
    patch:
      security:
        - BearerAuth: []
      description: Partially updates a listing. Only the seller may update their own
        listing.
      tags:
        - Listings
      summary: Update listing
      operationId: updateListing
      parameters:
        - description: Listing ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.SwaggerUpdateListingRequest"
        description: Fields to update
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.ListingWithImages"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  "/listings/{listingId}/messages":
    get:
      security:
        - BearerAuth: []
      description: Returns the conversation between the authenticated user and the
        other party for a given listing. Marks received messages as read.
      tags:
        - Messages
      summary: List messages for a listing
      operationId: getMessages
      parameters:
        - description: Listing ID
          name: listingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/model.MessageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
    post:
      security:
        - BearerAuth: []
      description: Sends a message from the authenticated user to the listing seller.
        Creates a notification for the receiver.
      tags:
        - Messages
      summary: Send a message about a listing
      operationId: sendMessage
      parameters:
        - description: Listing ID
          name: listingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.SwaggerSendMessageRequest"
        description: Message body
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.MessageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /messages/conversations:
    get:
      security:
        - BearerAuth: []
      description: Returns one summary entry per unique (listing, other_user)
        conversation pair the authenticated user is part of.
      tags:
        - Messages
      summary: List conversation threads
      operationId: getConversations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/model.ConversationResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /messages/unread-count:
    get:
      security:
        - BearerAuth: []
      description: Returns the number of unread messages for the authenticated user.
      tags:
        - Messages
      summary: Unread message count
      operationId: getUnreadMessageCount
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  "/messages/{id}/read":
    patch:
      security:
        - BearerAuth: []
      description: Marks a single message as read. Only the receiver may mark a
        message as read.
      tags:
        - Messages
      summary: Mark message as read
      operationId: markMessageAsRead
      parameters:
        - description: Message ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /notifications:
    get:
      security:
        - BearerAuth: []
      description: Returns all notifications for the authenticated user, newest first.
      tags:
        - Notifications
      summary: List notifications
      operationId: getNotifications
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/model.NotificationResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /notifications/read-all:
    patch:
      security:
        - BearerAuth: []
      description: Marks every unread notification for the authenticated user as read.
      tags:
        - Notifications
      summary: Mark all notifications as read
      operationId: markAllNotificationsAsRead
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /notifications/unread-count:
    get:
      security:
        - BearerAuth: []
      description: Returns the number of unread notifications for the authenticated user.
      tags:
        - Notifications
      summary: Unread notification count
      operationId: getUnreadNotificationCount
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  "/notifications/{id}/read":
    patch:
      security:
        - BearerAuth: []
      description: Marks a single notification as read. Returns 404 if the
        notification does not belong to the current user.
      tags:
        - Notifications
      summary: Mark notification as read
      operationId: markNotificationAsRead
      parameters:
        - description: Notification ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /orders:
    get:
      security:
        - BearerAuth: []
      description: Returns all orders for the authenticated user, newest first
      tags:
        - Orders
      summary: List orders
      operationId: getOrders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/model.OrderResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
    post:
      security:
        - BearerAuth: []
      description: Creates an order from the authenticated user's cart, marks listings
        as sold, and clears the cart
      tags:
        - Orders
      summary: Checkout
      operationId: checkout
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerMessageResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
  /users/me:
    get:
      security:
        - BearerAuth: []
      description: Returns the authenticated user's profile information
      tags:
        - Users
      summary: Get current user
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
    put:
      security:
        - BearerAuth: []
      description: Updates the authenticated user's name and/or avatar image
      tags:
        - Users
      summary: Update current user
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/model.SwaggerUpdateUserRequest"
        description: Fields to update
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.User"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/model.SwaggerErrorResponse"
servers:
