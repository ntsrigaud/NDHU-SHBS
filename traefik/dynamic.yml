# Traefik dynamic routing for local Docker development.
http:
  routers:
    client:
      rule: "PathPrefix(`/`)"
      service: client

    api:
      rule: "PathPrefix(`/api`) || PathPrefix(`/swagger`) || Path(`/live`) || Path(`/ready`)"
      service: api

    ai:
      rule: "PathPrefix(`/ai`)"
      middlewares:
        - ai-strip
      service: ai

  middlewares:
    ai-strip:
      stripPrefix:
        prefixes:
          - /ai

  services:
    client:
      loadBalancer:
        servers:
          - url: "http://client:3000"

    api:
      loadBalancer:
        servers:
          - url: "http://api:8080"

    ai:
      loadBalancer:
        servers:
          - url: "http://ai:8000"
