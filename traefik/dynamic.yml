# Traefik dynamic routing — client is served by Vercel, not this host.
http:
  routers:
    api:
      rule: "PathPrefix(`/api`) || PathPrefix(`/swagger`) || Path(`/live`) || Path(`/ready`)"
      service: api

    ai:
      rule: "PathPrefix(`/ai`)"
      middlewares:
        - ai-strip
      service: ai

  middlewares:
    ai-strip:
      stripPrefix:
        prefixes:
          - /ai

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:8080"

    ai:
      loadBalancer:
        servers:
          - url: "http://ai:8000"
