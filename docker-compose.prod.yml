# Production compose — uses pre-built images from GHCR instead of local builds.
# Used by the staging deploy job; do NOT use for local development.
services:
  # ──────────────────────────────────────────────────────────────
  # Reverse proxy
  # ──────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - app-network
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────
  # Database (no external port exposure in production)
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shbs}
    healthcheck:
      test: "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shbs} -h localhost"
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  # ──────────────────────────────────────────────────────────────
  # Go API server — pre-built image from GHCR
  # ──────────────────────────────────────────────────────────────
  api:
    image: ghcr.io/ntsrigaud/ndhu-shbs-server:latest
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/shbs?sslmode=disable}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # ──────────────────────────────────────────────────────────────
  # Python AI microservice — pre-built image from GHCR
  # ──────────────────────────────────────────────────────────────
  ai:
    image: ghcr.io/ntsrigaud/ndhu-shbs-ai:latest
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    networks:
      - app-network

  # Next.js client is deployed to Vercel — not part of the host stack.

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
